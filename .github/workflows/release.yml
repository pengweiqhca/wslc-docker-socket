name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publishing ${{ matrix.rid }}
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x
    - name: Resolve version
      id: version
      shell: pwsh
      run: |
        $version = if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -match '^v(\d+\.\d+\.\d+)$') {
          $Matches[1]
        } else {
          '0.0.0'
        }
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "Publishing version $version"
    - name: Publish
      shell: pwsh
      run: >
        dotnet publish WslcDockerSocket/WslcDockerSocket.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained false
        -p:PublishSingleFile=true
        -p:Version=${{ steps.version.outputs.version }}
        -o publish/${{ matrix.rid }}
    - name: Package
      shell: pwsh
      run: |
        Copy-Item README.md -Destination publish/${{ matrix.rid }}
        New-Item -ItemType Directory -Path artifacts | Out-Null
        Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath artifacts/wslc-docker-socket-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
    - uses: actions/upload-artifact@v4
      with:
        name: wslc-docker-socket-${{ matrix.rid }}
        path: artifacts/*.zip
        if-no-files-found: error

  release:
    name: Publishing GitHub release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Create release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: >
        gh release create "$GITHUB_REF_NAME" artifacts/*.zip
        --repo "$GITHUB_REPOSITORY"
        --title "$GITHUB_REF_NAME"
        --generate-notes
